[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[project]
name = "hayate-htmx"
version = "0.2.0"
description = "Full-stack hypermedia integration for Hayate and htmx"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuke Hayashi" }]
keywords = ["hayate", "htmx", "hypermedia", "html"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
  "hayate>=0.12.0",
  "jinja2>=3.1.6,<4",
  "markupsafe==3.0.2; sys_platform == 'emscripten' and python_version < '3.14'",
]

[project.optional-dependencies]
htpy = ["htpy>=26.5,<27"]
jx = ["jx>=0.11,<0.12"]
tdom = ["tdom>=0.1.18,<0.2; python_version >= '3.14'"]
all = [
  "htpy>=26.5,<27",
  "jx>=0.11,<0.12",
  "tdom>=0.1.18,<0.2; python_version >= '3.14'",
]

[project.urls]
Repository = "https://github.com/hayatepy/hayate-htmx"
Documentation = "https://github.com/hayatepy/hayate-htmx#readme"
Changelog = "https://github.com/hayatepy/hayate-htmx/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "hayate-auth>=0.10.0",
  "htpy>=26.5,<27",
  "jx>=0.11,<0.12",
  "mypy>=1.18",
  "playwright>=1.54,<2",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "tdom>=0.1.18,<0.2; python_version >= '3.14'",
  "uvicorn>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "browser: end-to-end smoke tests that require an installed Chromium browser",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "examples", "tests", "typing_tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
